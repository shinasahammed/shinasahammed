<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Shinas Ahammed — Neon Developer Banner</title>
  <desc id="desc">Dark futuristic background with mint and blue gradients, stars, and glowing orbital lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080912"/>
      <stop offset=".52" stop-color="#11152b"/>
      <stop offset="1" stop-color="#080912"/>
    </linearGradient>
    <radialGradient id="mintGlow">
      <stop offset="0" stop-color="#5EF2C0" stop-opacity=".30"/>
      <stop offset="1" stop-color="#5EF2C0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow">
      <stop offset="0" stop-color="#60A5FA" stop-opacity=".26"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EF2C0" stop-opacity="0"/>
      <stop offset=".5" stop-color="#5EF2C0" stop-opacity=".75"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#94A3B8" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <ellipse cx="230" cy="80" rx="360" ry="210" fill="url(#mintGlow)"/>
  <ellipse cx="1000" cy="270" rx="370" ry="220" fill="url(#blueGlow)"/>
  <g fill="#E5E7EB">
    <circle cx="90" cy="60" r="1.8" opacity=".8"/><circle cx="170" cy="230" r="1.4" opacity=".6"/>
    <circle cx="310" cy="45" r="1.3" opacity=".8"/><circle cx="440" cy="260" r="1.6" opacity=".6"/>
    <circle cx="580" cy="70" r="1.2" opacity=".7"/><circle cx="720" cy="240" r="1.7" opacity=".6"/>
    <circle cx="850" cy="55" r="1.5" opacity=".7"/><circle cx="1040" cy="95" r="1.8" opacity=".8"/>
    <circle cx="1120" cy="220" r="1.3" opacity=".7"/><circle cx="960" cy="280" r="1.1" opacity=".8"/>
  </g>
  <g fill="none" stroke-width="1.5" opacity=".8">
    <path d="M-40 245 C220 140 340 340 600 210 S990 100 1240 175" stroke="url(#line)"/>
    <path d="M-40 270 C220 165 340 365 600 235 S990 125 1240 200" stroke="url(#line)" opacity=".45"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="190" cy="195" r="4" fill="#5EF2C0"/>
    <circle cx="1000" cy="130" r="4" fill="#60A5FA"/>
    <circle cx="860" cy="250" r="3" fill="#F472B6"/>
  </g>
  <rect x="56" y="54" width="5" height="150" rx="2.5" fill="#5EF2C0"/>
  <text x="84" y="112" fill="#94A3B8" font-family="monospace" font-size="16" letter-spacing="5">HELLO, WORLD</text>
  <text x="80" y="164" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">SHINAS AHAMMED K</text>
  <text x="84" y="202" fill="#5EF2C0" font-family="monospace" font-size="19">FLUTTER DEVELOPER</text>
  <text x="84" y="238" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="15">Building useful apps, one feature at a time.</text>
  <g transform="translate(930 85)" fill="none" stroke-width="2">
    <circle cx="80" cy="70" r="64" stroke="#5EF2C0" stroke-opacity=".7"/>
    <circle cx="80" cy="70" r="48" stroke="#60A5FA" stroke-opacity=".55" stroke-dasharray="7 9"/>
    <circle cx="80" cy="70" r="30" stroke="#F472B6" stroke-opacity=".65"/>
    <circle cx="80" cy="70" r="7" fill="#5EF2C0" stroke="none"/>
  </g>
</svg>
